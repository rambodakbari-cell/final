<style>
:root{--bg:#e9edf3;--tile:#fff;--fg:#111a33;--mu:#6b7490;--ln:#dfe4ee;--soft:#eef1f7;--ac:#2b4cff;--fill:#cdd7ff;--sun:#ffd23f;--dock:#111a33;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f1d;--tile:#161c33;--fg:#eef1ff;--mu:#8a93b3;--ln:#252d4a;--soft:#202845;--ac:#6c86ff;--fill:#27356f;--dock:#1e2547}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Bricolage Grotesque",-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none;overflow-x:hidden;width:100%}
#app{max-width:520px;margin:0 auto;padding:10px 18px 150px}
button,input,select{font:inherit;color:inherit;background:none;border:0;border-radius:0}
button{cursor:pointer;padding:0}
button:focus-visible,.r:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd b{flex:1;min-width:0;text-align:center;font-weight:700;font-size:17px;cursor:pointer}.hd button{width:44px;height:44px;border-radius:50%;background:var(--tile);color:var(--mu);font-size:20px}
.hero{position:relative;height:216px;border-radius:34px;background:var(--tile);overflow:hidden;margin:12px 0 18px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 26px}
.hero i{position:absolute;left:0;right:0;bottom:0;background:var(--fill);border-top:2px solid var(--ac);transition:height .7s cubic-bezier(.2,.8,.2,1)}
.hero i[style*="height:0%"],.hero i[style*="height: 0%"]{border-top:0}
.hero>:not(i){position:relative}
.big{font-size:88px;font-weight:800;line-height:1.1;letter-spacing:-2px;margin:0}
.sub{text-align:center;color:var(--mu);font-size:13px;margin:0 0 20px;min-height:1.7em}
.hero .sub{text-align:start;margin:0;font-size:15px;color:var(--fg);opacity:.7}
.two{display:flex;gap:10px;margin-top:12px}.two>div{flex:1;background:var(--tile);border-radius:26px;padding:16px 8px 6px}
.two .big{font-size:46px;text-align:center;letter-spacing:0}.two .sub{margin-bottom:8px}
.r{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--tile);border-radius:22px;margin-bottom:8px;cursor:pointer;min-height:58px}
.ck{width:28px;height:28px;border:2px solid var(--ln);border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;transition:background .2s,border-color .2s}
.r[aria-checked=true] .ck{background:var(--ac);border-color:var(--ac)}
.r[aria-checked=true] .ck:after{content:"✓"}
.r[aria-checked=true] .n{color:var(--mu);text-decoration:line-through}
.n{flex:1;min-width:0;text-align:start;overflow-wrap:anywhere}.m{color:var(--mu);font-size:12.5px}
.r[role=checkbox]>span.m{background:var(--sun);color:#3b2f00;border-radius:12px;padding:0 10px;font-weight:700}
.r .m[data-e]{padding:10px 6px;font-size:18px}
.sec{color:var(--mu);font-size:13px;font-weight:700;margin:22px 6px 8px}
.sk{padding:16px 18px;background:var(--tile);border-radius:26px;margin-bottom:10px}
.r2{display:flex;justify-content:space-between;align-items:center}.r2 .n{font-weight:700;font-size:17px}.r2 .m{font-size:22px;font-weight:800;color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--soft);margin:6px 0 8px}.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}.sp{flex:1}
.ln{background:var(--soft);border-radius:20px;padding:6px 16px;font-size:14px;min-height:40px}
.pr{background:var(--ac);color:#fff;border-radius:20px;padding:6px 24px;min-height:40px;font-weight:700}
.rd{color:#e5484d}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(92%,380px);display:flex;gap:2px;padding:5px;background:var(--dock);border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:9}
.tabs button{flex:1;color:rgba(255,255,255,.6);font-size:14px;border-radius:24px;min-height:44px}
.tabs button.on{background:rgba(255,255,255,.17);color:#fff;font-weight:700}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;line-height:1;box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 45%,transparent);z-index:5}
#ov{position:fixed;inset:0;background:rgba(5,8,20,.5);display:none;z-index:19}#ov.o{display:block}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--tile);border-radius:30px 30px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .28s;z-index:20;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;visibility:hidden}
#sh.o{transform:none;visibility:visible}
#sh h4{margin:0 0 8px;font-size:18px;font-weight:700}
input,select{width:100%;padding:12px 16px;margin-top:8px;background:var(--soft);border-radius:16px;font-size:16px;min-height:48px}
select option{background:var(--tile);color:var(--fg)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;text-align:start;display:block}
input.bad{box-shadow:0 0 0 1.5px #e5484d}
.wd{display:flex;gap:6px;margin:12px 0 6px}.wd button{flex:1;height:42px;border-radius:14px;background:var(--soft);color:var(--mu)}
.wd button.on{background:var(--ac);color:#fff}
#to{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100vw - 24px)}
#to.o{opacity:1;transform:translate(-50%,0);pointer-events:auto}#to button{color:inherit;font-weight:700;margin-inline-start:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.sk .r{background:var(--soft);margin-top:8px}.r[aria-checked=true] .n{opacity:.5;text-decoration:line-through}
.fa{display:block;color:var(--mu);font-size:13px;font-weight:400;line-height:1.7;font-family:Vazirmatn,Tahoma,-apple-system,sans-serif;text-align:start;margin-top:1px}.hd b .fa{display:inline}
.n[dir=auto],.n[dir=rtl],.n:lang(fa),[lang=fa],.fa,input[dir=auto],#sh input,#sh select{font-family:Vazirmatn,"Bricolage Grotesque",Tahoma,sans-serif}
.cat-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--mu);margin-inline-start:6px;white-space:nowrap;font-family:Vazirmatn,sans-serif}
.cat-work{background:rgba(79,123,255,.18);color:#8ab0ff}
.cat-study{background:rgba(168,85,247,.18);color:#d4a5ff}
.cat-personal{background:rgba(74,222,128,.18);color:#8dffb0}
.cat-health{background:rgba(251,146,60,.18);color:#ffc08a}
.cat-other{background:rgba(244,114,182,.18);color:#ffb0d4}
.tm-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--mu);margin-inline-start:6px;white-space:nowrap;font-family:"DM Mono",monospace}
.tm-warn{background:rgba(255,210,63,.18);color:#e8c84a}.tm-late{background:rgba(229,72,77,.22);color:#ff8a8e}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;font-size:11px;font-weight:700;margin-inline-end:6px;vertical-align:middle;flex:none}
.pri-high{background:rgba(229,72,77,.22);color:#ff8a8e}
.pri-med{background:rgba(255,210,63,.18);color:#e8c84a}
.pri-low{background:rgba(255,255,255,.08);color:var(--mu)}
.r[data-pri="2"]{border-color:rgba(229,72,77,.35)}
.r[data-pri="0"]{opacity:.85}
/* skin: pixel-terminal x timeline x heatmap, soft + animated */

body{font:15px/1.55 "DM Mono",Vazirmatn,ui-monospace,Menlo,monospace}

<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Add">＋</button>
<nav class="tabs" id="tabs"></nav>
<div id="ov"></div><div id="sh" role="dialog" aria-modal="true"></div><div id="to" role="status"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
(function(){
var WD=[1,2,3,4,5,6,0],WL="MTWTFSS".split("");
var PW=new Intl.DateTimeFormat("en-US",{weekday:"long",day:"numeric",month:"long"});
function $(i){return document.getElementById(i)}
function uid(){return Math.random().toString(36).slice(2,9)}
function K(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function dt(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function add(d,n){var r=new Date(d.getTime());r.setDate(r.getDate()+n);return r}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fa(n){return Number(n).toLocaleString("en-US")}
var CATS=[{id:"",n:"None · بدون دسته",c:""},{id:"work",n:"Work · کار",c:"cat-work"},{id:"study",n:"Study · درس",c:"cat-study"},{id:"personal",n:"Personal · شخصی",c:"cat-personal"},{id:"health",n:"Health · سلامت",c:"cat-health"},{id:"other",n:"Other · دیگر",c:"cat-other"}];
function catOf(t){var id=(t&&t.cat)||"";for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return CATS[0]}
function catBadge(t){var c=catOf(t);return c.id?'<span class="cat-badge '+c.c+'">'+esc(c.n.split(" · ")[0])+'</span>':""}
function catSelect(sel){return '<select id="fcat" aria-label="Category">'+CATS.map(function(c){return '<option value="'+c.id+'"'+(c.id===(sel||"")?" selected":"")+'>'+esc(c.n)+'</option>'}).join("")+'</select>'}
var PRIS=[{id:2,n:"High · بالا",c:"pri-high"},{id:1,n:"Medium · متوسط",c:"pri-med"},{id:0,n:"Low · پایین",c:"pri-low"}];
function priOf(t){var p=t&&t.pri!==undefined?+t.pri:1;for(var i=0;i<PRIS.length;i++)if(PRIS[i].id===p)return PRIS[i];return PRIS[1]}
function priBadge(t){var p=priOf(t);return '<span class="pri-badge '+p.c+'" title="'+esc(p.n)+'">'+(p.id===2?"⬆":p.id===0?"⬇":"·")+'</span>'}
function priSelect(sel){var v=sel!==undefined&&sel!==null?+sel:1;return '<select id="fpri" aria-label="Priority">'+PRIS.map(function(p){return '<option value="'+p.id+'"'+(p.id===v?" selected":"")+'>'+esc(p.n)+'</option>'}).join("")+'</select>'}
function sortTasks(ids){return ids.slice().sort(function(a,b){var pa=D.t[a].pri!==undefined?+D.t[a].pri:1,pb=D.t[b].pri!==undefined?+D.t[b].pri:1;if(pb!==pa)return pb-pa;var ta=D.t[a].tm||"99:99",tb=D.t[b].tm||"99:99";if(ta!==tb)return ta<tb?-1:1;return (D.t[a].n||"").localeCompare(D.t[b].n||"")})}

/* time limit for tasks (optional "HH:MM" in t.tm) */
function tmInfo(t){
  if(!t||!t.tm)return["",""];
  var lab="⏰ "+t.tm;
  if(t.done)return["",lab];
  if(t.d<cur)return["tm-late",lab+" · late"];
  if(t.d>cur)return["",lab];
  var p=t.tm.split(":"),n=new Date(),left=(+p[0]*60+(+p[1]||0))-(n.getHours()*60+n.getMinutes());
  if(left<0)return["tm-late",lab+" · late"];
  var l=left>=60?Math.floor(left/60)+"h "+(left%60)+"m":left+"m";
  return[left<=60?"tm-warn":"",lab+" · "+l+" left"];
}
function tmBadge(id){var i=tmInfo(D.t[id]);return i[1]?'<span class="tm-badge '+i[0]+'" data-tb="'+esc(id)+'">'+esc(i[1])+'</span>':""}
function tmRefresh(){[].forEach.call(document.querySelectorAll("[data-tb]"),function(e){var t=D.t[e.getAttribute("data-tb")];if(!t)return;var i=tmInfo(t);e.className="tm-badge "+i[0];if(e.textContent!==i[1])e.textContent=i[1]})}
function tmField(v){return'<div class="m" style="margin-top:10px">Time limit (optional) · محدودیت زمانی (اختیاری)</div><div class="row" style="margin-top:0;flex-wrap:nowrap"><input id="ftm" type="time" value="'+esc(v||"")+'" aria-label="Time limit" style="flex:1;min-width:0"><button type="button" class="ln" data-ct="1" aria-label="Clear time" style="margin-top:8px">✕</button></div>'}

/* data: h=habits t=tasks s=skills l=logs ("day|habitId") */
function conv(a,lg,T,S){
  var o={h:{},t:{},s:{},l:{}};
  Object.keys(a).forEach(function(i){(a[i].habits||[]).forEach(function(x){o.h[x.id]={n:x.name,since:x.since||K(new Date(a[i].order||Date.now())),days:[]}})});
  Object.keys(lg).forEach(function(d){var e=(lg[d]||{}).done||{};Object.keys(e).forEach(function(i){if(e[i]&&o.h[i])o.l[d+"|"+i]=1})});
  Object.keys(T).forEach(function(i){o.t[i]={n:T[i].title,d:T[i].date,done:!!T[i].done}});
  Object.keys(S).forEach(function(i){var k=S[i];o.s[i]={n:k.name,goal:k.goal,unit:k.unit,step:k.step,e:k.entries||[],o:k.order||0}});
  return o;
}
function load(){
  try{var o=JSON.parse(localStorage.getItem("lp2"));if(o&&o.h&&o.t&&o.s&&o.l)return o}catch(e){}
  var g=function(c){try{return JSON.parse(localStorage.getItem("lp_"+c)||"{}")}catch(e){return{}}};
  return conv(g("areas"),g("logs"),g("tasks"),g("skills"));
}
var cur=K(new Date()),day=cur,view="today",D=load(),PC={},okF=null,dF=null,tf=null,tt,stt="";
var cf=null,Q=[],known=null,busy=0;
try{cf=JSON.parse(localStorage.getItem("lp2c")||"null");Q=JSON.parse(localStorage.getItem("lp2q")||"[]")}catch(e){}
if(!localStorage.getItem("lp2b"))localStorage.setItem("lp2b",Date.now());

function save(){PC={};try{localStorage.setItem("lp2",JSON.stringify(D))}catch(e){toast("Couldn't save: storage full")}}
function sq(){try{localStorage.setItem("lp2q",JSON.stringify(Q))}catch(e){}}
function P(c,id,q){
  if(!q)save();if(!cf)return;
  Q=Q.filter(function(o){return o.c!==c||o.id!==id});
  Q.push({c:c,id:id,v:D[c][id]===undefined?null:D[c][id]});sq();if(!q)tick();
}

/* sync: per-item keys, no bulk deletes */
function base(){return cf.url.replace(/\/+$/,"")+"/"+encodeURIComponent(cf.code)}
function push(o){return fetch(base()+"/"+o.c+"/"+encodeURIComponent(o.id)+".json",{method:o.v===null?"DELETE":"PUT",body:o.v===null?undefined:JSON.stringify(o.v)}).then(function(r){if(!r.ok)throw 0})}
function flush(){if(!Q.length)return Promise.resolve();var o=Q[0];return push(o).then(function(){Q=Q.filter(function(x){return x!==o});sq();return flush()})}
function pull(){
  return fetch(base()+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(t){
    t=t||{};D.a=D.a||{};var any=Object.keys(t).length,pend={},nk={},ch=0;
    Q.forEach(function(o){pend[o.c+"/"+o.id]=1});
    ["h","t","s","l","a"].forEach(function(c){
      var rem=t[c]||{};
      Object.keys(rem).forEach(function(id){var k=c+"/"+id;nk[k]=1;if(pend[k])return;if(JSON.stringify(D[c][id])!==JSON.stringify(rem[id])){D[c][id]=rem[id];ch=1}});
      Object.keys(D[c]).forEach(function(id){var k=c+"/"+id;
        if(rem[id]!==undefined||pend[k])return;
        if(known&&known[k]&&any){delete D[c][id];ch=1}else Q.push({c:c,id:id,v:D[c][id]})});
    });
    known=nk;sq();if(ch){save();render()}
  });
}
function tick(){
  if(!cf||busy)return;busy=1;
  flush().then(pull).then(function(){stt="✓ Synced"},function(){stt=Q.length?"Offline, queued":"Offline"}).then(function(){busy=0;if(view==="st")render()});
}

/* logic */
function sched(h,k){return h.since<=k&&(!h.until||k<h.until)&&(!(h.days&&h.days.length)||h.days.indexOf(dt(k).getDay())>=0)}
function hOn(k){return Object.keys(D.h).filter(function(i){return sched(D.h[i],k)})}
function tOn(k){return Object.keys(D.t).filter(function(i){return D.t[i].d===k})}
function dn(k,i){return !!D.l[k+"|"+i]}
function pct(k){
  if(PC[k]!==undefined)return PC[k];
  var a=hOn(k),t=tOn(k),n=a.length+t.length,r=null,d=0;
  /* On today, also count unfinished overdue tasks so the day score reflects real workload */
  if(k===cur){
    Object.keys(D.t).forEach(function(i){if(!D.t[i].done&&D.t[i].d<cur){n++;}});
  }
  if(n&&k<=cur){
    a.forEach(function(i){if(dn(k,i))d++});
    t.forEach(function(i){if(D.t[i].done)d++});
    if(k===cur){/* overdue completed today already counted via tOn if moved; unfinished overdue inflate denominator only */}
    r=Math.round(d*100/n);
  }
  return PC[k]=r;
}
function streak(i){
  var h=D.h[i],run=0,best=0;
  for(var x=dt(h.since),e=dt(cur);x<=e;x=add(x,1)){var k=K(x);if(!sched(h,k))continue;
    if(dn(k,i)){run++;if(run>best)best=run}else if(k!==cur)run=0}
  return[run,best];
}
function rate(i){var h=D.h[i],s=0,d=0;for(var j=0;j<30;j++){var k=K(add(dt(cur),-j));if(sched(h,k)){s++;if(dn(k,i))d++}}return s?Math.round(d*100/s):null}
function avg(n){var s=0,c=0;for(var i=0;i<n;i++){var p=pct(K(add(dt(cur),-i)));if(p!==null){s+=p;c++}}return c?Math.round(s/c):null}
function sT(k){return(k.e||[]).reduce(function(a,e){return a+(+e.a||0)},0)}

/* views */
function row(a,id,n,on,m,e,extra,pri){
  var pAttr=(pri!==undefined&&pri!==null)?' data-pri="'+esc(pri)+'"':"";
  return'<div class="r" role="checkbox" tabindex="0" aria-checked="'+(!!on)+'" data-'+a+'="'+esc(id)+'"'+pAttr+'><span class="ck"></span><span class="n" dir="auto">'+(pri!==undefined&&pri!==null?priBadge({pri:pri}):"")+esc(n)+(extra||"")+'</span>'+(m?'<span class="m">'+m+'</span>':"")+'<button class="m" data-e="'+esc(e)+'" aria-label="Edit">⋯</button></div>';
}
function vToday(){
  var p=pct(day),h='<div class="hd"><button data-a="pv" aria-label="Previous day">‹</button><b data-a="td" title="Today">'+PW.format(dt(day))+'</b><button data-a="nx" aria-label="Next day">›</button></div>';
  h+='<div class="hero"><i style="height:'+(p||0)+'%"></i><div class="big">'+(p===null?"—":fa(p)+"%")+'</div><div class="sub">'+(p===null?(day>cur?"Upcoming · آینده":"Nothing planned · برنامه‌ای نیست"):p<1?"Get started · شروع کن":p<50?"Keep going · ادامه بده":p<100?"Almost there · نزدیک شدی":"All done · همه انجام شد")+'</div></div>';
  var n=0;
  if(day===cur){
    var od=Object.keys(D.t).filter(function(i){return!D.t[i].done&&D.t[i].d<cur}).sort(function(a,b){return D.t[a].d<D.t[b].d?-1:1});

    else{D.t[id]={n:n,d:$("f2").value||day,done:false,cat:$("fcat").value||"",pri:+$("fpri").value,tm:$("ftm").value||""};day=D.t[id].d;P("t",id)}
    ov(0);render();
  });
  $("f1").onchange=function(){var h=this.value==="h";$("pt").style.display=h?"none":"";$("pw").style.display=h?"":"none"};
}
function edit(c){
  var p=c.split(":"),id=p[1];
  if(p[0]==="t"){var t=D.t[id];
    sheet("Edit · ویرایش",inp("f0","Title · عنوان",t.n)+inp("f2","",t.d,"date")+catSelect(t.cat||"")+priSelect(t.pri!==undefined?t.pri:1)+tmField(t.tm),function(){var n=$("f0").value.trim();if(!n)return bad();t.n=n;t.d=$("f2").value||t.d;t.cat=$("fcat").value||"";t.pri=+$("fpri").value;t.tm=$("ftm").value||"";P("t",id);ov(0);render()},
      function(){var s=D.t[id];delete D.t[id];P("t",id);ov(0);render();toast("Deleted · حذف شد",function(){D.t[id]=s;P("t",id)})});
  }else{var h=D.h[id];
    sheet("Edit habit",inp("f0","Title",h.n)+wdHtml(h.days),function(){var n=$("f0").value.trim();if(!n)return bad();h.n=n;h.days=wds();P("h",id);ov(0);render()},
      function(){var s=JSON.parse(JSON.stringify(h));if(h.since>=cur)delete D.h[id];else h.until=cur;P("h",id);ov(0);render();toast("Archived. History kept",function(){D.h[id]=s;P("h",id)})},"Archive");
  }
}
function skS(id){
  var k=id?D.s[id]:{n:"",goal:"",unit:"",step:"",due:""};
  sheet(id?"Edit skill":"New skill",inp("f0","Skill name",k.n)+inp("f1","Goal (number)",k.goal,"number")+inp("f2","Unit (hours, pages…)",k.unit)+inp("f3","Quick add (number)",k.step,"number")+'<div class="m" style="margin-top:8px">Deadline (optional)</div>'+inp("f4","",k.due,"date"),function(){
    var n=$("f0").value.trim();if(!n)return bad();
    var o={n:n,goal:+$("f1").value||100,unit:$("f2").value.trim()||"units",step:+$("f3").value||1,due:$("f4").value};
    if(id){for(var q in o)k[q]=o[q];P("s",id)}else{var i=uid();o.e=[];o.o=Date.now();D.s[i]=o;P("s",i)}
    ov(0);render();
  },id?function(){var s=D.s[id];delete D.s[id];P("s",id);ov(0);render();toast("Deleted",function(){D.s[id]=s;P("s",id)})}:null);
}
function skAdd(id){
  var k=D.s[id];
  sheet("Log progress",inp("f0","Amount ("+(k.unit||"units")+")",k.step||1,"number")+inp("f2","",cur,"date"),function(){
    var a=+$("f0").value;if(!a)return bad();k.e=(k.e||[]).concat([{d:$("f2").value||cur,a:a}]);P("s",id);ov(0);render();
  });
}
function hist(id){
  var k=D.s[id],es=k.e||[],h=es.length?"":'<div class="sub">No entries yet</div>';
  for(var i=es.length-1,c=0;i>=0&&c<30;i--,c++)h+='<div class="r" style="cursor:default"><span class="n">'+PW.format(dt(es[i].d))+'</span><span class="m">'+fa(es[i].a)+' '+esc(k.unit||"")+'</span><button class="m" data-xe="'+esc(id)+':'+i+'" aria-label="Delete entry" style="padding:10px">✕</button></div>';
  $("sh").innerHTML='<h4>'+esc(k.n)+'</h4>'+h+'<div class="row"><button class="ln" id="sno">Close</button></div>';okF=null;dF=null;ov(1);
}
function synS(){
  var c=cf||{url:"",code:uid()+uid()+uid()};
  sheet("Sync (Firebase)",inp("f0","Realtime Database URL (https://…)",c.url)+inp("f1","Code (same on all devices)",c.code),function(){
    var u=$("f0").value.trim(),cd=$("f1").value.trim();
    if(u.indexOf("https://")!==0||cd.length<12){bad();return toast("URL must start with https and code needs 12+ characters")}
    localStorage.setItem("lp2c",JSON.stringify({url:u,code:cd}));location.reload();
  },cf?function(){localStorage.removeItem("lp2c");localStorage.removeItem("lp2q");location.reload()}:null,"Disconnect");
}
function exp(){
  var b=new Blob([JSON.stringify({v:2,d:D})],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="planner-"+cur+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);localStorage.setItem("lp2b",Date.now());toast("Backup saved");
}
$("fi").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result).d,n=0;if(d&&d.areas)d=conv(d.areas,d.logs||{},d.tasks||{},d.skills||{});
    if(!d||["h","t","s","l"].some(function(c){return!d[c]||typeof d[c]!=="object"}))throw 0;
    ["h","t","s","l"].forEach(function(c){Object.keys(d[c]).forEach(function(id){D[c][id]=d[c][id];P(c,id,1);n++})});
    save();render();tick();toast(fa(n)+" items restored");
  }catch(x){toast("Invalid file")}};
  r.readAsText(f);this.value="";
};

/* events */
document.addEventListener("click",function(e){
  var t=e.target;function A(a){var x=t.closest("["+a+"]");return x?x.getAttribute(a):null}var v;
  if(t.id==="sok"){if(okF)okF();return}
  if(t.id==="sno"||t.id==="ov"){ov(0);return}
  if(t.id==="sdel"){if(dF)dF();return}
  if(t.id==="tu"){var f=tf;tf=null;$("to").classList.remove("o");if(f){f();render()}return}
  var w;if((w=A("data-ao"))!==null){ahO=ahO===+w?-1:+w;render();return}
  if((w=A("data-ah"))!==null){var q=w.split(":"),k="p"+q[0];D.a[k]=D.a[k]||{x:{}};var xx=D.a[k].x;if(xx[q[1]])delete xx[q[1]];else xx[q[1]]=1;P("a",k);render();return}
  if(t.closest("#fab")){view==="sk"?skS():addS();return}
  if(A("data-ct")!==null){$("ftm").value="";return}
  if((v=A("data-w"))!==null){t.closest("[data-w]").classList.toggle("on");return}
  if((v=A("data-qd"))!==null){$("f2").value=K(add(dt(cur),+v));return}
  if((v=A("data-xe"))!==null){var p=v.split(":");D.s[p[0]].e.splice(+p[1],1);P("s",p[0]);hist(p[0]);render();return}
  if((v=A("data-e"))!==null)return edit(v);
  if((v=A("data-mv"))!==null){D.t[v].d=cur;P("t",v);return render()}
  if((v=A("data-v"))!==null){view=v;render();scrollTo(0,0);return}
  if((v=A("data-a"))!==null){
    if(v==="pv"||v==="nx")day=K(add(dt(day),v==="pv"?-1:1));
    else if(v==="td")day=cur;
    return render();
  }
  if((v=A("data-q"))!==null){var k=D.s[v];k.e=(k.e||[]).concat([{d:cur,a:+k.step||1}]);P("s",v);render();toast("Logged",function(){k.e.pop();P("s",v)});return}
  if((v=A("data-ad"))!==null)return skAdd(v);
  if((v=A("data-se"))!==null)return skS(v);
  if((v=A("data-hi"))!==null)return hist(v);
  if((v=A("data-bk"))!==null){if(v==="1")exp();else $("fi").click();return}
  if(A("data-syn")!==null)return synS();
  if((v=A("data-h"))!==null){var key=day+"|"+v;if(D.l[key])delete D.l[key];else D.l[key]=1;P("l",key);return render()}
  if((v=A("data-t"))!==null){D.t[v].done=!D.t[v].done;P("t",v);return render()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")ov(0);
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("r")){e.preventDefault();e.target.click()}
  else if(e.key==="Enter"&&e.target.tagName==="INPUT"&&okF)okF();
});
var tx=0,ty=0;
document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",function(e){
  if(view!=="today"||$("ov").classList.contains("o"))return;
  var t=e.changedTouches[0],dx=t.clientX-tx;
  if(Math.abs(dx)>90&&Math.abs(t.clientY-ty)<45){day=K(add(dt(day),dx>0?-1:1));render()}
},{passive:true});
if(window.visualViewport)visualViewport.addEventListener("resize",function(){var v=visualViewport;$("sh").style.bottom=Math.max(0,innerHeight-v.height-v.offsetTop)+"px"});
function chk(){var n=K(new Date());if(n!==cur){if(day===cur)day=n;cur=n;PC={};render()}}
document.addEventListener("visibilitychange",function(){if(!document.hidden){chk();tick();tmRefresh()}});
setInterval(function(){chk();tick();tmRefresh()},8000);
save();render();tick();
})();
</script>
